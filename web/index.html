<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PondRadar Fisheries Officer Decision Support Dashboard">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PondRadar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PondRadar</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #F8FAFC;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #0F766E;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #CCFBF1;
      border-top-color: #0F766E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      margin-top: 18px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #0F766E;
    }
  </style>

  <!-- Local environment config (gitignored) & Google Maps loader -->
  <script src="env.js"></script>
  <script>
    (function() {
      var key = (window.GOOGLE_MAPS_API_KEY && !window.GOOGLE_MAPS_API_KEY.includes('YOUR_'))
        ? window.GOOGLE_MAPS_API_KEY
        : (new URLSearchParams(window.location.search).get('maps_key') || localStorage.getItem('google_maps_api_key') || '');
      if (key) {
        document.write('<script src="https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '"><\/script>');
      }
      window.isGoogleMapsLoaded = function() {
        return typeof google !== 'undefined' && typeof google.maps !== 'undefined';
      };
      window.gm_authFailure = function() {
        console.warn('[PondRadar] Google Maps Authentication Failure: Ensure Maps JavaScript API is enabled in Google Cloud Console and localhost is allowed.');
      };
    })();
  </script>
</head>
<body>
  <div class="loading-container">
    <div class="spinner"></div>
    <div class="loading-title">PondRadar</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
